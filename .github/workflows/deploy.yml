# Builds the Angular app and deploys it to the CloudPanel server with rsync over SSH.
#
# Required repository secrets:
#   DEPLOY_HOST                 address of the server
#   DEPLOY_PATH                 site directory, e.g. /home/<site-user>/htdocs/<domain>
#   DEPLOY_SSH_KEY_POSTDEPLOY   private SSH key of the deploy user
#   DEPLOY_KNOWN_HOSTS          pinned host key, output of: ssh-keyscan -t ed25519 <DEPLOY_HOST>

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Preview what would change on the server without uploading or deleting anything
        type: boolean
        default: false

permissions:
  contents: read

# Never run two deployments at once and never cancel one halfway through.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  # Runs npm and all dependency code. It has no access to any secret, so a
  # compromised package can never read the SSH key.
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build production bundle
        run: npm run build

      - name: Upload build output
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: portfolio-browser-build
          path: dist/portfolio/browser
          if-no-files-found: error
          retention-days: 1

  # Holds the secrets but only runs rsync and ssh, never any repository code.
  deploy:
    name: Deploy
    needs: build
    # A manual run from another branch must never reach production.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - name: Download build output
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: portfolio-browser-build
          path: build-output

      - name: Verify build output
        run: |
          if [ ! -f build-output/index.html ]; then
            echo "::error::The build output has no index.html, refusing to deploy."
            exit 1
          fi

      - name: Upload to server
        env:
          # CloudPanel site user that owns the web root.
          DEPLOY_USER: hamidoudiallo
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_SSH_KEY_POSTDEPLOY: ${{ secrets.DEPLOY_SSH_KEY_POSTDEPLOY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -eu

          for secret_name in DEPLOY_HOST DEPLOY_PATH DEPLOY_SSH_KEY_POSTDEPLOY DEPLOY_KNOWN_HOSTS; do
            if [ -z "${!secret_name}" ]; then
              echo "::error::Repository secret $secret_name is missing or empty."
              exit 1
            fi
          done

          # rsync --delete removes everything in the target that is not part of the
          # build, so refuse to run against anything but a CloudPanel site directory.
          if [[ ! "$DEPLOY_PATH" =~ ^/home/[a-z0-9_-]+/htdocs/[A-Za-z0-9][A-Za-z0-9.-]*/?$ ]]; then
            echo "::error::DEPLOY_PATH must look like /home/<site-user>/htdocs/<domain>."
            exit 1
          fi

          umask 077
          ssh_directory="$(mktemp -d)"
          trap 'rm -rf "$ssh_directory"' EXIT
          printf '%s\n' "$DEPLOY_SSH_KEY_POSTDEPLOY" > "$ssh_directory/private_key"

          # Pin the ed25519 host key to DEPLOY_HOST. Only the key itself is trusted, so
          # it does not matter whether the pasted line names the server by IP or domain.
          host_key="$(grep -oE -m 1 'ssh-ed25519 [A-Za-z0-9+/=]+' <<< "$DEPLOY_KNOWN_HOSTS" || true)"
          if [ -z "$host_key" ]; then
            echo "::error::DEPLOY_KNOWN_HOSTS contains no ssh-ed25519 host key. Create it with: ssh-keyscan -t ed25519 <host>"
            exit 1
          fi
          printf '%s %s\n' "$DEPLOY_HOST" "$host_key" > "$ssh_directory/known_hosts"

          # Public information: compare with the fingerprint you verified on the server.
          ssh-keygen -lf "$ssh_directory/known_hosts"

          rsync_arguments=(
            --recursive
            --perms
            --checksum
            --compress
            --itemize-changes
            --delay-updates
            --delete-delay
            --chmod=D755,F644
            # The certificate challenge directory exists only on the server and must
            # survive --delete. Everything else that is not part of the build is removed,
            # so a stray file, for example a planted script, does not outlive a deployment.
            --exclude=/.well-known/
            --rsh="ssh -i $ssh_directory/private_key -o IdentitiesOnly=yes -o UserKnownHostsFile=$ssh_directory/known_hosts -o StrictHostKeyChecking=yes -o HostKeyAlgorithms=ssh-ed25519 -o BatchMode=yes -o ConnectTimeout=20"
          )

          if [ "$DRY_RUN" = "true" ]; then
            rsync_arguments+=(--dry-run)
          fi

          rsync "${rsync_arguments[@]}" build-output/ "$DEPLOY_USER@$DEPLOY_HOST:${DEPLOY_PATH%/}/"
